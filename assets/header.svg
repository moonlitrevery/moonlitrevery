<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="João, machine learning engineer">
  <title>João - machine learning engineer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10002b"/>
      <stop offset="0.55" stop-color="#240046"/>
      <stop offset="1" stop-color="#3c096c"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#9d4edd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9d4edd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#e0aaff" opacity="0.05"/>
    </pattern>
    <mask id="cres">
      <circle cx="770" cy="120" r="54" fill="#fff"/>
      <circle cx="795" cy="104" r="46" fill="#000"/>
    </mask>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <path id="orb" d="M674,120 a96,30 0 1,0 192,0 a96,30 0 1,0 -192,0"/>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace; }
    .name { font-size: 88px; font-weight: 700; letter-spacing: 6px; }
    .sub  { font-size: 20px; letter-spacing: 3px; fill: #c77dff; }
    .tag  { font-size: 14px; fill: #9d4edd; opacity: 0; animation: cycle 12s infinite; }
    .twk  { animation: twinkle 3s ease-in-out infinite; }
    .blink { animation: blink 1s steps(1) infinite; }
    .gh1  { fill: #7b2cbf; opacity: 0; animation: glitchA 6s infinite; }
    .gh2  { fill: #9d4edd; opacity: 0; animation: glitchB 6s infinite; }
    .slice { fill: #c77dff; opacity: 0; animation: slice 6s infinite; }

    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes cycle { 0% { opacity: 0; } 5% { opacity: 1; } 30% { opacity: 1; } 35% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes glitchA {
      0%,90%,100% { opacity: 0; transform: translate(0,0); }
      91% { opacity: .9; transform: translate(-6px,1px); }
      93% { opacity: .9; transform: translate(5px,-2px); }
      95% { opacity: .9; transform: translate(-3px,2px); }
      97% { opacity: 0; transform: translate(0,0); }
    }
    @keyframes glitchB {
      0%,90%,100% { opacity: 0; transform: translate(0,0); }
      92% { opacity: .8; transform: translate(6px,-1px); }
      94% { opacity: .8; transform: translate(-5px,2px); }
      96% { opacity: .8; transform: translate(2px,-2px); }
      98% { opacity: 0; transform: translate(0,0); }
    }
    @keyframes slice {
      0%,90%,100% { opacity: 0; transform: translateY(0); }
      91% { opacity: .45; transform: translateY(40px); }
      94% { opacity: .45; transform: translateY(-8px); }
      97% { opacity: .45; transform: translateY(24px); }
      98% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .twk, .blink, .gh1, .gh2, .slice { animation: none; }
      .tag { animation: none; }
      .tag.first { opacity: 1; }
    }
  </style>

  <rect width="900" height="260" fill="url(#bg)"/>
  <rect width="900" height="260" fill="url(#scan)"/>

  <!-- stars -->
  <g fill="#e0aaff">
    <circle class="twk" cx="420" cy="40"  r="1.5" style="animation-delay:0s"/>
    <circle class="twk" cx="520" cy="90"  r="1"   style="animation-delay:.7s"/>
    <circle class="twk" cx="610" cy="30"  r="1.5" style="animation-delay:1.4s"/>
    <circle class="twk" cx="660" cy="205" r="1"   style="animation-delay:2.1s"/>
    <circle class="twk" cx="480" cy="215" r="1.5" style="animation-delay:.3s"/>
    <circle class="twk" cx="560" cy="160" r="1"   style="animation-delay:1.1s"/>
    <circle class="twk" cx="40"  cy="40"  r="1"   style="animation-delay:1.8s"/>
    <circle class="twk" cx="30"  cy="225" r="1.5" style="animation-delay:2.5s"/>
    <circle class="twk" cx="250" cy="28"  r="1"   style="animation-delay:.9s"/>
    <circle class="twk" cx="340" cy="228" r="1"   style="animation-delay:1.6s"/>
    <circle class="twk" cx="860" cy="38"  r="1.5" style="animation-delay:.5s"/>
    <circle class="twk" cx="875" cy="205" r="1"   style="animation-delay:2.2s"/>
    <circle class="twk" cx="700" cy="36"  r="1"   style="animation-delay:1.3s"/>
    <circle class="twk" cx="640" cy="150" r="1.5" style="animation-delay:2.8s"/>
  </g>

  <!-- moon -->
  <circle cx="770" cy="120" r="125" fill="url(#halo)"/>
  <g transform="rotate(-20 770 120)">
    <use href="#orb" fill="none" stroke="#5a189a" stroke-width="1" stroke-dasharray="3 6"/>
    <circle r="3" fill="#c77dff">
      <animateMotion dur="9s" repeatCount="indefinite"><mpath href="#orb"/></animateMotion>
    </circle>
  </g>
  <circle cx="770" cy="120" r="54" fill="#e0aaff" mask="url(#cres)"/>
  <circle cx="770" cy="120" r="54" fill="#9d4edd" mask="url(#cres)" filter="url(#soft)" opacity=".6"/>

  <!-- name with glitch layers -->
  <text class="mono name gh1" x="56" y="138">João</text>
  <text class="mono name gh2" x="56" y="138">João</text>
  <text class="mono name" x="56" y="138" fill="#e0aaff">João</text>
  <rect class="slice" x="50" y="75" width="400" height="7"/>

  <!-- subtitle -->
  <text class="mono sub" x="60" y="182">machine learning engineer<tspan class="blink">_</tspan></text>

  <!-- rotating tagline -->
  <text class="mono tag first" x="60" y="222" style="animation-delay:0s">// production-ready ML systems</text>
  <text class="mono tag" x="60" y="222" style="animation-delay:4s">// fascinated by how machines learn</text>
  <text class="mono tag" x="60" y="222" style="animation-delay:8s">// hobbyst on a ton of stuff</text>
</svg>
