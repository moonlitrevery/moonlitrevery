<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" role="img" aria-label="Terminal session: whoami returns joao, machine learning engineer. about.md and now.md describe building production-ready ML systems with MLOps practices.">
  <title>terminal</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10002b"/>
      <stop offset="1" stop-color="#240046"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d4edd"/>
      <stop offset="0.5" stop-color="#3c096c"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#e0aaff" opacity="0.05"/>
    </pattern>
    <clipPath id="win">
      <rect x="14" y="14" width="792" height="372" rx="14"/>
    </clipPath>
    <mask id="cres">
      <circle cx="745" cy="100" r="24" fill="#fff"/>
      <circle cx="756" cy="92" r="20" fill="#000"/>
    </mask>
  </defs>

  <style>
    .m { font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, 'DejaVu Sans Mono', monospace; font-size: 14px; }
    .o { fill: #e0aaff; }
    .p { fill: #9d4edd; }
    .c { fill: #c77dff; font-weight: 700; }
    .l { opacity: 0; animation: show .01s forwards; }
    .cur { opacity: 0; animation: blink 1s steps(1) infinite; animation-delay: 4.2s; }
    .twk { animation: twinkle 3s ease-in-out infinite; }
    .g1 { fill: #7b2cbf; opacity: 0; animation: glitchA 6s infinite; animation-delay: 1.5s; }
    .g2 { fill: #c77dff; opacity: 0; animation: glitchB 6s infinite; animation-delay: 1.5s; }
    .tg1 { fill: #7b2cbf; opacity: 0; animation: glitchA 7s infinite; animation-delay: 3s; }
    .tg2 { fill: #c77dff; opacity: 0; animation: glitchB 7s infinite; animation-delay: 3s; }

    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
    @keyframes glitchA {
      0%,90%,100% { opacity: 0; transform: translate(0,0); }
      91% { opacity: .9; transform: translate(-4px,0); }
      93% { opacity: .9; transform: translate(3px,-1px); }
      95% { opacity: .9; transform: translate(-2px,1px); }
      97% { opacity: 0; transform: translate(0,0); }
    }
    @keyframes glitchB {
      0%,90%,100% { opacity: 0; transform: translate(0,0); }
      92% { opacity: .8; transform: translate(4px,1px); }
      94% { opacity: .8; transform: translate(-3px,0); }
      96% { opacity: .8; transform: translate(2px,-1px); }
      98% { opacity: 0; transform: translate(0,0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .l { animation: none; opacity: 1; }
      .cur { animation: none; opacity: 1; }
      .twk, .g1, .g2, .tg1, .tg2 { animation: none; }
    }
  </style>

  <!-- outer glow + window -->
  <rect x="14" y="14" width="792" height="372" rx="14" fill="#7b2cbf" opacity="0.45" filter="url(#glow)"/>
  <rect x="14" y="14" width="792" height="372" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#win)">
    <rect x="14" y="14" width="792" height="34" fill="#240046"/>
    <rect x="14" y="48" width="792" height="1" fill="#3c096c"/>
    <rect x="14" y="14" width="792" height="372" fill="url(#scan)"/>
  </g>
  <rect x="14.5" y="14.5" width="791" height="371" rx="14" fill="none" stroke="url(#bd)" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="36" cy="31" r="5" fill="#7b2cbf"/>
  <circle cx="54" cy="31" r="5" fill="#9d4edd"/>
  <circle cx="72" cy="31" r="5" fill="#c77dff"/>
  <g class="m" text-anchor="middle">
    <text class="tg1" x="410" y="36">moonlit - zsh</text>
    <text class="tg2" x="410" y="36">moonlit - zsh</text>
    <text class="p" x="410" y="36">moonlit - zsh</text>
  </g>

  <!-- moon ornament -->
  <g filter="url(#glow)" opacity="0.7"><circle cx="745" cy="100" r="24" fill="#9d4edd" mask="url(#cres)"/></g>
  <circle cx="745" cy="100" r="24" fill="#e0aaff" mask="url(#cres)"/>
  <g fill="#e0aaff">
    <circle class="twk" cx="690" cy="76"  r="1.2" style="animation-delay:0s"/>
    <circle class="twk" cx="785" cy="72"  r="1.5" style="animation-delay:.8s"/>
    <circle class="twk" cx="715" cy="140" r="1"   style="animation-delay:1.6s"/>
    <circle class="twk" cx="780" cy="145" r="1.2" style="animation-delay:2.3s"/>
    <circle class="twk" cx="670" cy="115" r="1"   style="animation-delay:1.1s"/>
  </g>

  <!-- session -->
  <g class="m">
    <text class="l" x="38" y="82" style="animation-delay:.3s"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text>

    <g class="l" style="animation-delay:.9s">
      <text class="g1" x="38" y="104">joao - machine learning engineer</text>
      <text class="g2" x="38" y="104">joao - machine learning engineer</text>
      <text class="o" x="38" y="104">joao - machine learning engineer</text>
    </g>

    <text class="l" x="38" y="148" style="animation-delay:1.5s"><tspan class="p">$ </tspan><tspan class="c">cat about.md</tspan></text>
    <text class="l o" x="38" y="170" style="animation-delay:2s">Builds data systems that go beyond analysis: scalable pipelines, APIs and</text>
    <text class="l o" x="38" y="192" style="animation-delay:2.15s">production-ready ML. Background in BI and analytics, now focused on</text>
    <text class="l o" x="38" y="214" style="animation-delay:2.3s">end-to-end workflows - data processing, feature engineering, deployment</text>
    <text class="l o" x="38" y="236" style="animation-delay:2.45s">and monitoring.</text>

    <text class="l" x="38" y="280" style="animation-delay:3.2s"><tspan class="p">$ </tspan><tspan class="c">cat now.md</tspan></text>
    <text class="l o" x="38" y="302" style="animation-delay:3.7s">Real-world ML systems with MLOps practices: experiment tracking,</text>
    <text class="l o" x="38" y="324" style="animation-delay:3.85s">reproducibility and data drift awareness.</text>

    <text class="l p" x="38" y="368" style="animation-delay:4.2s">$</text>
    <rect class="cur" x="54" y="355" width="8" height="15" fill="#c77dff"/>
  </g>
</svg>
